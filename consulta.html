<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<script>
  /* PORTAL SUPPLY · si no se ha entrado al Portal en esta pestaña, manda al candado de entrada y regresa aquí. */
  try{ if(sessionStorage.getItem('ps_entrada_ok')!=='1') location.replace('index.html?ir=consulta'); }catch(e){ location.replace('index.html?ir=consulta'); }
</script>
<title>Consulta por marca · Portal Supply</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     PORTAL SUPPLY · Consulta por marca (solo lectura).
     Los datos viven en la carpeta consulta/ (un archivo por marca).
     Para actualizar una marca: reemplazar su archivo .json. No se toca este HTML.
     ========================================================= */
  :root{--coal:#2F2F2F;--coal3:#3A3A3A;--gold:#BC9831;--gold-l:#E6D6A8;--paper:#FBFAF6;--ink:#2F2F2F;--soft:#5E5A52;--line:#ECE7DB;--chip:#F2ECDD;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--coal);color:#fff;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
       background-image:radial-gradient(1100px 480px at 85% -10%,rgba(188,152,49,.16),transparent 60%);}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 22px 40px;}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .back{font:inherit;font-size:13px;font-weight:600;color:#fff;text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:7px 15px;}
  .back:hover{background:var(--gold);color:var(--coal);}
  h1{margin:18px 0 4px;font-size:clamp(30px,4.4vw,46px);line-height:1.05;letter-spacing:-.6px;}
  .lead{margin:0 0 20px;color:#CFC7B3;font-size:14.5px;max-width:720px;line-height:1.5;}
  /* Selector de marca */
  .brands{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .brand{position:relative;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:#fff;cursor:pointer;overflow:hidden;
         background:var(--coal3);border:2px solid rgba(188,152,49,.25);border-radius:16px;padding:16px 16px 16px 18px;min-height:118px;
         background-image:linear-gradient(rgba(188,152,49,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(188,152,49,.08) 1px,transparent 1px);background-size:22px 22px;
         transition:border-color .18s,transform .18s,box-shadow .18s;}
  .brand:hover{border-color:rgba(188,152,49,.7);transform:translateY(-2px);}
  .brand.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(188,152,49,.25),0 18px 40px -18px rgba(0,0,0,.8);}
  .brand:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px;}
  .brand .tx{flex:1;min-width:0;}
  .brand .nm{display:block;font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.05;}
  .brand .plate{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:7px 11px;box-shadow:0 6px 16px -8px rgba(0,0,0,.6);}
  .brand .plate img{display:block;height:28px;width:auto;max-width:150px;}
  .brand .plate img[src*="heydude"]{height:40px;margin:-6px -4px;}
  .banda .plate img[src*="heydude"]{height:52px;margin:-8px -4px;}
  .brand::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--bc,#BC9831);opacity:.35;transition:opacity .2s;}
  .brand.on::after,.brand:hover::after{opacity:1;}
  /* Banda de la marca seleccionada */
  .banda{position:relative;overflow:hidden;border-radius:14px;margin:-4px -4px 16px;padding:20px 22px;min-height:150px;color:#fff;display:flex;align-items:center;gap:20px;
         background:linear-gradient(115deg,color-mix(in srgb,var(--bc) 78%,#000) 0%,color-mix(in srgb,var(--bc) 35%,#2F2F2F) 55%,#2F2F2F 100%);}
  .banda::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.3px);background-size:16px 16px;opacity:.6;}
  .banda > *{position:relative;}
  .banda .bl{flex:1;min-width:0;}
  .banda .plate{display:inline-flex;background:#fff;border-radius:12px;padding:9px 14px;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);}
  .banda .plate img{display:block;height:34px;width:auto;}
  .banda .kp{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px;}
  .banda .kp div{font-size:12px;color:rgba(255,255,255,.78);line-height:1.3;}
  .banda .kp b{display:block;font-size:22px;color:#fff;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
  .banda .kp b.sm{font-size:15px;}
  .banda .pr{flex:none;width:300px;height:130px;display:flex;align-items:center;justify-content:center;}
  .banda .pr img{max-width:100%;max-height:130px;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45));}
  @media (prefers-reduced-motion:no-preference){ .banda .pr img{animation:flota 4.5s ease-in-out infinite;} @keyframes flota{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(1deg)}} }
  .brand .mt{display:block;font-size:12.5px;color:#CFC7B3;margin-top:6px;line-height:1.45;}
  .brand .st{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:rgba(188,152,49,.18);color:var(--gold-l);}
  .brand.on .st{background:var(--gold);color:var(--coal);}
  .brand .ar{flex:none;width:112px;height:80px;display:flex;align-items:center;justify-content:center;}
  .brand .ar svg{width:112px;height:80px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s;}
  .brand .ar svg .l{stroke:var(--gold-l);stroke-width:1.5;}
  .brand .ar svg .f{fill:var(--gold);stroke:none;}
  .brand .ar img{max-width:112px;max-height:80px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));transition:transform .35s;}
  .brand:hover .ar svg,.brand:hover .ar img,.brand.on .ar svg,.brand.on .ar img{transform:scale(1.07) rotate(-3deg);}
  /* Panel de consulta */
  .panel{margin-top:18px;background:var(--paper);color:var(--ink);border-radius:16px;padding:18px 18px 14px;min-height:260px;}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search{flex:1 1 320px;position:relative;}
  .search input{width:100%;font:inherit;font-size:15px;padding:11px 14px 11px 38px;border:1px solid #CFCAC0;border-radius:10px;outline:none;background:#fff;}
  .search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(188,152,49,.2);}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:none;stroke:#8F887A;stroke-width:2;stroke-linecap:round;}
  .tools select{font:inherit;font-size:13.5px;padding:9px 10px;border:1px solid #CFCAC0;border-radius:10px;background:#fff;color:var(--ink);max-width:190px;}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--coal);color:#fff;white-space:nowrap;}
  .btn:hover{background:var(--gold);color:var(--coal);}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid #CFCAC0;}
  .btn.ghost:hover{border-color:var(--gold);background:transparent;}
  .groups{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;}
  .gchip{font:inherit;font-size:13px;font-weight:600;border:1px solid #DCD5C4;background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;}
  .gchip.on{background:var(--coal);color:#fff;border-color:var(--coal);}
  .gchip small{font-weight:500;opacity:.75;margin-left:4px;}
  .summary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin:10px 0 8px;}
  .summary b{color:var(--ink);}
  .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:860px;}
  th{position:sticky;top:0;text-align:left;background:var(--coal);color:#fff;font-weight:600;padding:9px 10px;white-space:nowrap;}
  td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;}
  tbody tr{cursor:pointer;}
  tbody tr:hover td{background:#F6F1E4;}
  td.mc{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--chip);color:#5E4A12;white-space:nowrap;}
  .pill.nuevo{background:#E3F0E7;color:#1F5C36;} .pill.linea{background:#E7ECF6;color:#2A4677;} .pill.desc{background:#F3E1DE;color:#8A2518;}
  .pill.no{background:#FCE9C7;color:#8A4B00;}
  .muted{color:#A39C8C;}
  .more{display:flex;justify-content:center;margin-top:12px;}
  .empty{padding:34px 10px;text-align:center;color:var(--soft);font-size:14px;line-height:1.6;}
  .loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:50px 10px;color:var(--soft);font-size:14px;}
  .spin{width:22px;height:22px;border:3px solid #E6DFCD;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fuentes{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--soft);line-height:1.55;}
  .fuentes summary{cursor:pointer;font-weight:600;color:var(--ink);}
  .fuentes ul{margin:8px 0 0;padding-left:18px;}
  /* Detalle (tallas) */
  #det{position:fixed;inset:0;display:none;z-index:40;background:rgba(20,20,20,.6);backdrop-filter:blur(2px);}
  #det.show{display:block;}
  .det-card{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--paper);color:var(--ink);overflow:auto;
            padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:-20px 0 50px -20px rgba(0,0,0,.6);}
  .det-top{display:flex;align-items:flex-start;gap:10px;}
  .det-top h2{margin:0;font-size:22px;flex:1;line-height:1.2;}
  .x{font:inherit;font-size:20px;line-height:1;border:0;background:var(--chip);border-radius:999px;width:34px;height:34px;cursor:pointer;color:var(--ink);}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:14px 0 16px;}
  .kv dt{color:var(--soft);} .kv dd{margin:0;font-weight:600;}
  .sz{width:100%;border-collapse:collapse;font-size:13px;min-width:0;}
  .sz th{position:static;}
  .sz td{font-variant-numeric:tabular-nums;}
  .cp{font:inherit;font-size:11.5px;font-weight:600;border:1px solid #DCD5C4;background:#fff;border-radius:999px;padding:2px 9px;cursor:pointer;}
  .cp:hover{border-color:var(--gold);}
  .note{font-size:12.5px;color:var(--soft);background:#F4EEDF;border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.5;}
  .foot{margin-top:30px;font-size:12.5px;color:#8F887A;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .foot strong{color:#E6E1D5;font-weight:600;}
  @media (max-width:820px){
    .brands{grid-template-columns:1fr;}
    .brand .nm{font-size:22px;}
    .brand .ar,.brand .ar svg{width:92px;height:66px;}
    .brand .ar img{max-width:92px;max-height:66px;}
    .banda{flex-direction:column;align-items:flex-start;}
    .banda .pr{width:100%;height:110px;order:-1;}
    .banda .pr img{max-height:110px;}
    .tools select{max-width:none;flex:1 1 45%;}
  }
.xmsg{font-size:12.5px;font-weight:600;color:#5E5A52;align-self:center;}
.xmsg.err{color:#A32A1F;}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="index.html">← Regresar al menú</a></div>
  <h1>Consulta por marca</h1>
  <p class="lead">Busca por modelo-color, descripción, UPC o SKU. Toca un renglón para ver sus tallas con UPC y SKU.</p>

  <div class="brands" id="brands"></div>

  <div class="panel" id="panel">
    <div class="banda" id="banda" style="display:none;"></div>
    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Modelo-color, descripción, UPC o SKU" aria-label="Buscar"></label>
      <select id="fSil" aria-label="Silueta"></select>
      <select id="fGen" aria-label="Género"></select>
      <select id="fTem" aria-label="Temporada"></select>
      <select id="fEst" aria-label="Estatus"></select>
      <select id="fUpc" aria-label="UPC"><option value="">Con y sin UPC</option><option value="si">Con UPC</option><option value="no">Sin UPC</option></select>
      <button class="btn ghost" id="clr">Limpiar</button>
      <button class="btn" id="csv" title="Toda la marca, una fila por talla">Descargar Excel completo</button>
      <button class="btn ghost" id="xlsF" style="display:none;" title="Solo lo que ves con tus filtros, una fila por talla">Solo lo filtrado</button>
      <span id="xlsMsg" class="xmsg" aria-live="polite"></span>
    </div>
    <div class="groups" id="groups"></div>
    <div class="summary"><span id="sum"></span><span id="corte"></span></div>
    <div id="res"><div class="loading"><span class="spin"></span>Cargando…</div></div>
    <div class="more" id="moreBox" style="display:none;"><button class="btn ghost" id="more">Ver 100 más</button></div>
    <details class="fuentes" id="fuentes"></details>
  </div>

  <footer class="foot"><span>Creado por <strong>Alejandro Vega</strong> · Supply Planning</span><span>Consulta por marca · Portal Supply · <span id="ver"></span></span></footer>
</div>

<div id="det" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="det-card" id="detCard"></div>
</div>

<script>
/* =================== CONFIG =================== */
var CONFIG = {
  version: 'v1.3 · 04-oct-2026',
  marcas: [
    // logo y foto: imágenes PNG en consulta/img/ (si se ponen en null se usa el nombre y un dibujo genérico). color: acento de la marca.
    { id:'crocs',     nombre:'Crocs',     archivo:'consulta/crocs.json',     color:'#82C342', logo:'consulta/img/logo_crocs.png',     foto:'consulta/img/foto_crocs.png',     dibujo:'zueco' },
    { id:'heydude',   nombre:'Hey Dude',  archivo:'consulta/heydude.json',   color:'#4E86C5', logo:'consulta/img/logo_heydude.png',   foto:'consulta/img/foto_heydude.png',   dibujo:'slipon' },
    { id:'havaianas', nombre:'Havaianas', archivo:'consulta/havaianas.json', color:'#E4051F', logo:'consulta/img/logo_havaianas.png', foto:'consulta/img/foto_havaianas.png', dibujo:'sandalia' }
  ]
};
/* ============================================== */
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var C = { mc:0, desc:1, color:2, gen:3, sil:4, tem:5, est:6, upc:7 };
  /* Dibujos genéricos (no son logos ni productos reales de las marcas) */
  window.DIBUJOS = {
    zueco: '<svg viewBox="0 0 112 80"><path d="M10 58 C 10 40, 24 30, 42 30 L 64 31 C 74 32, 80 38, 88 42 L 98 48 C 104 52, 104 58, 102 62 H 10 Z"/><path class="l" d="M10 62 H102"/><path d="M30 31 C 22 22, 10 26, 12 40"/><circle class="f" cx="50" cy="40" r="2.4"/><circle class="f" cx="60" cy="38" r="2.4"/><circle class="f" cx="70" cy="42" r="2.4"/><circle class="f" cx="56" cy="47" r="2.4"/><circle class="f" cx="66" cy="50" r="2.4"/><circle class="f" cx="78" cy="48" r="2.4"/></svg>',
    slipon: '<svg viewBox="0 0 112 80"><path d="M8 56 C 8 46, 16 40, 28 40 L 52 38 C 62 37, 70 42, 80 46 L 96 50 C 104 52, 106 56, 104 60 H 8 Z"/><path class="l" d="M8 60 H104 M8 66 H104"/><path class="l" d="M48 42 C 56 40, 64 42, 70 46"/><path class="l" d="M54 44 l3 4 M60 44 l3 4 M66 46 l3 4"/><path d="M26 40 C 26 34, 34 32, 40 34"/></svg>',
    sandalia: '<svg viewBox="0 0 112 80"><path d="M14 54 C 14 40, 32 34, 56 36 C 82 38, 98 44, 98 54 C 98 64, 82 70, 56 70 C 30 70, 14 66, 14 54 Z"/><path class="l" d="M22 54 C 22 46, 36 42, 56 43 C 78 44, 90 48, 90 54"/><path d="M78 52 C 62 46, 48 42, 34 40 M78 52 C 66 56, 52 60, 40 64"/><circle class="f" cx="78" cy="52" r="3"/></svg>'
  };
  var DIBUJOS = window.DIBUJOS;
  var cache = {}, D = null, marca = null, grupo = null, lista = [], mostrados = 0, PAG = 100;
  $('ver').textContent = CONFIG.version;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function v(x){ return x==null||x==='' ? '<span class="muted">—</span>' : esc(x); }
  function norm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function fmt(n){ return n.toLocaleString('es-MX'); }
  function pillEst(e){
    if(e==null) return '<span class="muted">—</span>';
    var c = /nuevo/i.test(e)?'nuevo':/l[ií]nea/i.test(e)?'linea':/descont/i.test(e)?'desc':'';
    return '<span class="pill '+c+'">'+esc(e)+'</span>';
  }
  function fechaCorte(f){ if(!f) return 'sin fecha'; return f.fecha_corte ? f.fecha_corte : (f.nota || 'sin fecha'); }

  /* ---------- Selector de marca ---------- */
  CONFIG.marcas.forEach(function(m){
    var b = document.createElement('button'); b.className='brand'; b.id='b_'+m.id; b.type='button';
    var nom = m.logo ? '<span class="plate"><img src="'+esc(m.logo)+'" alt="'+esc(m.nombre)+'" onerror="this.parentNode.outerHTML=\''+esc(m.nombre)+'\'"></span>' : esc(m.nombre);
    b.style.setProperty('--bc', m.color||'#BC9831');
    var art = m.foto ? '<img src="'+esc(m.foto)+'" alt="" onerror="this.outerHTML=DIBUJOS[\''+m.dibujo+'\']">' : (DIBUJOS[m.dibujo]||'');
    b.innerHTML = '<span class="tx"><span class="nm">'+nom+'</span><span class="mt" id="bm_'+m.id+'">Toca para cargar</span><span class="st" id="bs_'+m.id+'">Ver catálogo</span></span><span class="ar" aria-hidden="true">'+art+'</span>';
    b.onclick = function(){ elegir(m.id); };
    $('brands').appendChild(b);
  });

  function cargar(m){
    if(cache[m.id]) return Promise.resolve(cache[m.id]);
    return fetch(m.archivo, {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('No se encontró '+m.archivo+' ('+r.status+')'); return r.json(); })
      .then(function(d){
        // Índices: todas las filas del line list y búsqueda inversa UPC/SKU → modelo-color
        var filas = [], enLL = {};
        d.grupos.forEach(function(g){ g.filas.forEach(function(r){ r._g = g.id; r._k = norm(r[C.mc]+' '+r[C.desc]+' '+r[C.color]); filas.push(r); enLL[r[C.mc]] = r; }); });
        var upc = {};
        for(var mc in d.mm){ d.mm[mc].split(';').forEach(function(p){ var i=p.lastIndexOf(' '); upc[p.slice(i+1)] = mc; }); }
        d._filas = filas; d._enLL = enLL; d._upc = upc;
        d._mmSolo = Object.keys(d.mm).length - Object.keys(d.mm).filter(function(k){ return enLL[k]; }).length;
        cache[m.id] = d; return d;
      });
  }

  function elegir(id){
    var m = CONFIG.marcas.filter(function(x){ return x.id===id; })[0]; if(!m) return;
    marca = m; grupo = null;
    document.querySelectorAll('.brand').forEach(function(b){ b.classList.toggle('on', b.id==='b_'+id); });
    try{ history.replaceState(null,'','?marca='+id); }catch(e){}
    $('res').innerHTML = '<div class="loading"><span class="spin"></span>Cargando '+esc(m.nombre)+'…</div>';
    $('moreBox').style.display='none'; $('sum').textContent=''; $('corte').textContent='';
    cargar(m).then(function(d){
      if(marca!==m) return;
      D = d;
      $('bm_'+id).textContent = fmt(d._filas.length)+' modelos-color · '+fmt(Object.keys(d.mm).length)+' en Material Master';
      var tallas = 0; for(var k in d.mm){ tallas += d.mm[k].split(';').length; }
      var f = d.fuentes||{}, sinUpc = d._filas.filter(function(r){ return !r[C.upc]; }).length;
      var bd = $('banda'); bd.style.setProperty('--bc', m.color||'#BC9831');
      bd.innerHTML = '<div class="bl">'+(m.logo?'<span class="plate"><img src="'+esc(m.logo)+'" alt="'+esc(m.nombre)+'"></span>':'<span style="font-size:30px;font-weight:700;">'+esc(m.nombre)+'</span>')+
        '<div class="kp"><div><b>'+fmt(d._filas.length)+'</b>modelos-color en Line List</div><div><b>'+fmt(tallas)+'</b>tallas en Material Master</div><div><b>'+fmt(sinUpc)+'</b>sin UPC todavía</div>'+
        '<div><b class="sm">'+esc((f.line_list&&f.line_list.fecha_corte)||'sin fecha')+'</b>corte Line List</div><div><b class="sm">'+esc((f.material_master&&f.material_master.fecha_corte)||'sin fecha')+'</b>corte Material Master</div></div></div>'+
        (m.foto?'<div class="pr"><img src="'+esc(m.foto)+'" alt=""></div>':'');
      bd.style.display='flex';
      montarFiltros(); filtrar();
    }).catch(function(e){
      $('res').innerHTML = '<div class="empty"><b>No se pudieron cargar los datos de '+esc(m.nombre)+'.</b><br>'+esc(e.message)+'<br>Revisa que el archivo esté en la carpeta consulta/ del repo.</div>';
    });
  }

  /* ---------- Filtros ---------- */
  function opciones(sel, col, titulo){
    var cnt = {}; D._filas.forEach(function(r){ if(grupo && r._g!==grupo) return; var k=r[col]==null?'':r[col]; cnt[k]=(cnt[k]||0)+1; });
    var keys = Object.keys(cnt).sort(function(a,b){ if(a==='') return 1; if(b==='') return -1; return a.localeCompare(b,'es'); });
    var prev = $(sel).value;
    $(sel).innerHTML = '<option value="">'+titulo+'</option>' + keys.map(function(k){ return '<option value="'+esc(k===''?'__vacio':k)+'">'+esc(k===''?'(sin dato)':k)+' ('+fmt(cnt[k])+')</option>'; }).join('');
    if(Array.prototype.some.call($(sel).options,function(o){ return o.value===prev; })) $(sel).value = prev;
  }
  function montarFiltros(){
    $('groups').innerHTML = '<button class="gchip'+(grupo?'':' on')+'" data-g="">Todo<small>'+fmt(D._filas.length)+'</small></button>' +
      D.grupos.map(function(g){ return '<button class="gchip'+(grupo===g.id?' on':'')+'" data-g="'+esc(g.id)+'">'+esc(g.nombre)+'<small>'+fmt(g.filas.length)+'</small></button>'; }).join('');
    $('groups').querySelectorAll('.gchip').forEach(function(b){ b.onclick=function(){ grupo = b.getAttribute('data-g')||null; montarFiltros(); filtrar(); }; });
    opciones('fSil',C.sil,'Silueta: todas'); opciones('fGen',C.gen,'Género: todos'); opciones('fTem',C.tem,'Temporada: todas'); opciones('fEst',C.est,'Estatus: todos');
    var f = D.fuentes || {};
    $('corte').textContent = 'Line List: '+fechaCorte(f.line_list)+' · Material Master: '+fechaCorte(f.material_master);
    var li = function(t,x){ if(!x) return ''; return '<li><b>'+t+':</b> '+esc(x.archivo||'sin archivo')+' · corte: '+esc(x.fecha_corte||'sin fecha')+(x.nota?' · '+esc(x.nota):'')+'</li>'; };
    $('fuentes').innerHTML = '<summary>De dónde salen estos datos ('+esc(D.marca)+')</summary><ul>'+li('Line List',f.line_list)+li('Material Master',f.material_master)+li('Estatus',f.estatus)+
      '<li><b>Generado:</b> '+esc(D.generado||'')+' · '+esc(D.origen_datos||'')+'</li></ul>' +
      (D.notas&&D.notas.length ? '<ul>'+D.notas.map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('')+'</ul>' : '');
  }
  function pasa(r, val, col){ if(!val) return true; return val==='__vacio' ? (r[col]==null||r[col]==='') : String(r[col])===val; }

  function filtrar(){
    if(!D) return;
    var q = norm($('q').value.trim()), fs=$('fSil').value, fg=$('fGen').value, ft=$('fTem').value, fe=$('fEst').value, fu=$('fUpc').value;
    var extra = [];  // modelos-color que solo están en el Material Master y coinciden por UPC/SKU
    var porCodigo = null;
    if(q){
      var qr = $('q').value.trim();
      // UPC exacto
      if(/^\d{8,14}$/.test(qr) && D._upc[qr]) porCodigo = D._upc[qr];
      // SKU exacto (modelo-color + talla)
      if(!porCodigo){ var i = qr.lastIndexOf('-'); if(i>0){ var mc = qr.slice(0,i), t = qr.slice(i+1); if(D.mm[mc] && D.mm[mc].split(';').some(function(p){ return p.split(' ')[0].toLowerCase()===t.toLowerCase(); })) porCodigo = mc; } }
    }
    lista = D._filas.filter(function(r){
      if(grupo && r._g!==grupo) return false;
      if(porCodigo){ if(r[C.mc]!==porCodigo) return false; }
      else if(q && r._k.indexOf(q)<0) return false;
      if(!pasa(r,fs,C.sil)||!pasa(r,fg,C.gen)||!pasa(r,ft,C.tem)||!pasa(r,fe,C.est)) return false;
      if(fu==='si' && !r[C.upc]) return false; if(fu==='no' && r[C.upc]) return false;
      return true;
    });
    if(porCodigo && !D._enLL[porCodigo]) extra.push(porCodigo);
    else if(q && !porCodigo && lista.length===0 && D.mm[$('q').value.trim()]) extra.push($('q').value.trim());
    mostrados = 0; $('res').innerHTML=''; pintar(extra);
    var hf = hayFiltros() && lista.length>0 && lista.length<D._filas.length; $('xlsF').style.display = hf ? '' : 'none'; if(hf) $('xlsF').textContent = 'Solo lo filtrado ('+fmt(lista.length)+')';
  }

  function pintar(extra){
    var html = '';
    if(mostrados===0){
      html += '<div class="tbl"><table><thead><tr><th>Modelo-color</th><th>Descripción</th><th>Color</th><th>Género</th><th>Silueta</th><th>Temporada</th><th>Estatus</th><th>UPC</th><th>Tallas</th></tr></thead><tbody id="tb">';
      (extra||[]).forEach(function(mc){
        var n = D.mm[mc].split(';').length;
        html += '<tr data-mc="'+esc(mc)+'"><td class="mc">'+esc(mc)+'</td><td colspan="6"><span class="pill">Solo en Material Master</span> <span class="muted">sin ficha en el Line List</span></td><td><span class="pill">Sí</span></td><td>'+n+'</td></tr>';
      });
      html += '</tbody></table></div>';
      $('res').innerHTML = html;
    }
    var tb = $('tb'), parte = lista.slice(mostrados, mostrados+PAG), rows='';
    parte.forEach(function(r){
      var n = D.mm[r[C.mc]] ? D.mm[r[C.mc]].split(';').length : 0;
      rows += '<tr data-mc="'+esc(r[C.mc])+'"><td class="mc">'+esc(r[C.mc])+'</td><td>'+v(r[C.desc])+'</td><td>'+v(r[C.color])+'</td><td>'+v(r[C.gen])+'</td><td>'+v(r[C.sil])+'</td><td>'+v(r[C.tem])+'</td><td>'+pillEst(r[C.est])+'</td><td>'+(r[C.upc]?'<span class="pill">Sí</span>':'<span class="pill no">Sin UPC</span>')+'</td><td>'+(n||'<span class="muted">—</span>')+'</td></tr>';
    });
    tb.insertAdjacentHTML('beforeend', rows);
    mostrados += parte.length;
    var tot = lista.length + (extra?extra.length:0);
    if(tot===0) $('res').innerHTML = '<div class="empty"><b>Sin resultados.</b><br>Prueba con otra palabra, quita filtros con “Limpiar”, o busca el UPC completo.</div>';
    $('sum').innerHTML = '<b>'+fmt(tot)+'</b> resultado'+(tot===1?'':'s')+(lista.length>mostrados?' · mostrando '+fmt(mostrados):'');
    $('moreBox').style.display = lista.length>mostrados ? 'flex' : 'none';
  }
  $('more').onclick = function(){ pintar(null); };
  $('res').addEventListener('click', function(e){ var tr = e.target.closest('tr[data-mc]'); if(tr) detalle(tr.getAttribute('data-mc')); });

  /* ---------- Detalle ---------- */
  function detalle(mc){
    var r = D._enLL[mc], tallas = D.mm[mc] ? D.mm[mc].split(';').map(function(p){ var i=p.lastIndexOf(' '); return [p.slice(0,i), p.slice(i+1)]; }) : [];
    var g = r ? D.grupos.filter(function(x){ return x.id===r._g; })[0] : null;
    var h = '<div class="det-top"><h2 id="dTitle">'+esc(mc)+(r&&r[C.desc]?'<br><span style="font-size:15px;font-weight:500;color:#5E5A52;">'+esc(r[C.desc])+'</span>':'')+'</h2><button class="x" id="dX" aria-label="Cerrar">×</button></div>';
    if(r){
      h += '<dl class="kv"><dt>Marca</dt><dd>'+esc(D.marca)+'</dd><dt>Grupo</dt><dd>'+esc(g?g.nombre:'')+'</dd><dt>Color</dt><dd>'+v(r[C.color])+'</dd><dt>Género</dt><dd>'+v(r[C.gen])+'</dd><dt>Silueta</dt><dd>'+v(r[C.sil])+'</dd><dt>Temporada</dt><dd>'+v(r[C.tem])+'</dd><dt>Estatus</dt><dd>'+pillEst(r[C.est])+'</dd></dl>';
    } else {
      h += '<div class="note" style="margin:14px 0;">Este modelo-color está en el Material Master pero no tiene ficha en el Line List cargado.</div>';
    }
    if(tallas.length){
      h += '<div class="tbl"><table class="sz"><thead><tr><th>Talla</th><th>SKU</th><th>UPC</th><th></th></tr></thead><tbody>' +
        tallas.map(function(t){ var sku = mc+'-'+t[0]; return '<tr><td>'+esc(t[0])+'</td><td>'+esc(sku)+'</td><td>'+esc(t[1])+'</td><td><button class="cp" data-c="'+esc(t[1])+'">Copiar UPC</button></td></tr>'; }).join('') +
        '</tbody></table></div><div style="margin-top:10px;"><button class="btn ghost" id="cpAll">Copiar todas las tallas</button> <span id="cpMsg" style="font-size:12.5px;font-weight:600;color:#2E6B47;"></span></div>';
    } else {
      h += '<div class="note">Todavía no tiene UPC en el Material Master cargado.</div>';
    }
    var f = D.fuentes||{};
    h += '<div class="note">Material Master: '+esc(fechaCorte(f.material_master))+'. Line List: '+esc(fechaCorte(f.line_list))+'.</div>';
    $('detCard').innerHTML = h; $('det').classList.add('show'); document.body.style.overflow='hidden';
    $('dX').onclick = cerrarDet; $('dX').focus();
    function copiar(t){ var ok=function(){ $('cpMsg').textContent='Copiado'; setTimeout(function(){ $('cpMsg').textContent=''; },1500); };
      if(navigator.clipboard) navigator.clipboard.writeText(t).then(ok, function(){ $('cpMsg').style.color='#8A6A12'; $('cpMsg').textContent='Selecciónalo y copia con Ctrl+C'; }); }
    $('detCard').querySelectorAll('.cp').forEach(function(b){ b.onclick=function(){ copiar(b.getAttribute('data-c')); }; });
    if($('cpAll')) $('cpAll').onclick = function(){ copiar(['Talla\tSKU\tUPC'].concat(tallas.map(function(t){ return t[0]+'\t'+mc+'-'+t[0]+'\t'+t[1]; })).join('\n')); };
  }
  function cerrarDet(){ $('det').classList.remove('show'); document.body.style.overflow=''; }
  $('det').addEventListener('click', function(e){ if(e.target===$('det')) cerrarDet(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && $('det').classList.contains('show')) cerrarDet(); });

  /* ---------- Descarga a Excel (.xlsx con formato, una fila por talla) ---------- */
  var XLSX_LIB = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
  var libP = null;
  function cargarLib(){
    if(window.ExcelJS) return Promise.resolve();
    if(!libP) libP = new Promise(function(ok, no){ var sc = document.createElement('script'); sc.src = XLSX_LIB; sc.onload = function(){ window.ExcelJS ? ok() : no(new Error('sin ExcelJS')); }; sc.onerror = function(){ libP = null; no(new Error('No cargó el generador de Excel')); }; document.head.appendChild(sc); });
    return libP;
  }
  function hayFiltros(){ return !!(grupo || $('q').value.trim() || $('fSil').value || $('fGen').value || $('fTem').value || $('fEst').value || $('fUpc').value); }
  function descFiltros(){
    var p = [], gn = {}; D.grupos.forEach(function(g){ gn[g.id]=g.nombre; });
    if(grupo) p.push('Grupo: '+gn[grupo]); if($('q').value.trim()) p.push('Búsqueda: '+$('q').value.trim());
    [['fSil','Silueta'],['fGen','Género'],['fTem','Temporada'],['fEst','Estatus']].forEach(function(x){ var v=$(x[0]).value; if(v) p.push(x[1]+': '+(v==='__vacio'?'(sin dato)':v)); });
    if($('fUpc').value) p.push($('fUpc').value==='si'?'Solo con UPC':'Solo sin UPC');
    return p.length ? p.join(' · ') : 'Ninguno (marca completa)';
  }
  function tallasDe(mc){ return D.mm[mc] ? D.mm[mc].split(';').map(function(x){ var i=x.lastIndexOf(' '); return [x.slice(0,i), x.slice(i+1)]; }) : []; }
  function msg(t, err){ $('xlsMsg').textContent = t||''; $('xlsMsg').className = 'xmsg'+(err?' err':''); }
  function nombreArchivo(ext, filtrado){ return 'Consulta_'+D.marca.replace(/\s+/g,'')+(filtrado?'_filtrado':'_completo')+'_'+new Date().toISOString().slice(0,10)+'.'+ext; }
  function bajar(blob, nombre){ var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  var TAL_COLS = ['Marca','Grupo','Modelo-color','Descripción','Color','Género','Silueta','Temporada','Estatus','Talla','SKU','UPC'];
  function filasTalla(rows){
    var gn = {}; D.grupos.forEach(function(g){ gn[g.id]=g.nombre; }); var out = [];
    rows.forEach(function(r){
      var base = [D.marca, gn[r._g], r[C.mc], r[C.desc], r[C.color], r[C.gen], r[C.sil], r[C.tem], r[C.est]];
      var ts = tallasDe(r[C.mc]);
      if(!ts.length) out.push(base.concat(['', '', 'Sin UPC todavía']));
      else ts.forEach(function(t){ out.push(base.concat([t[0], r[C.mc]+'-'+t[0], t[1]])); });
    });
    return out;
  }
  function exportarCSV(rows, filtrado){
    var q = function(x){ x = x==null?'':String(x); return /[",\n;]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x; };
    var lines = [TAL_COLS.join(',')].concat(filasTalla(rows).map(function(f){ return f.map(function(x,k){ return (k===2||k===10||k===11)&&x&&!/^Sin/.test(x) ? '="'+x+'"' : q(x); }).join(','); }));
    bajar(new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'}), nombreArchivo('csv', filtrado));
  }
  function exportar(rows, filtrado){
    if(!D || !rows.length) return;
    var marcaAct = marca, ft = filtrado ? descFiltros() : 'Ninguno (marca completa)';
    $('csv').disabled = $('xlsF').disabled = true; msg('Armando el Excel…');
    cargarLib().then(function(){ return new Promise(function(r){ setTimeout(r, 30); }); }).then(function(){
      var CARBON='FF2F2F2F', DORADO='FFBC9831', PAPEL='FFFBFAF6', acento = 'FF'+String(marcaAct.color||'#BC9831').replace('#','').toUpperCase();
      var wb = new ExcelJS.Workbook(); wb.creator = 'Portal Supply'; wb.created = new Date();
      var head = function(ws, n){
        var h = ws.getRow(1); h.height = 24;
        for(var c=1;c<=n;c++){ var cl = h.getCell(c); cl.font={bold:true,color:{argb:'FFFFFFFF'},name:'Calibri',size:11}; cl.fill={type:'pattern',pattern:'solid',fgColor:{argb:CARBON}}; cl.alignment={vertical:'middle',horizontal:'center',wrapText:true}; cl.border={bottom:{style:'medium',color:{argb:DORADO}}}; }
        ws.views = [{state:'frozen', ySplit:1}]; ws.autoFilter = {from:{row:1,column:1}, to:{row:1,column:n}};
      };
      var estatusCF = function(ws, col, last){
        var ref = col+'2:'+col+last, col1 = col+'2';
        ws.addConditionalFormatting({ref:ref, rules:[
          {type:'containsText', operator:'containsText', text:'Nuevo', priority:1, style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFE3F1D8'}}, font:{color:{argb:'FF2E6B47'},bold:true}}},
          {type:'containsText', operator:'containsText', text:'Descont', priority:2, style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFF6E0DD'}}, font:{color:{argb:'FFA32A1F'}}}}
        ]});
      };
      /* Hoja 1: Tallas */
      var ft1 = filasTalla(rows);
      var ws = wb.addWorksheet('Tallas', {properties:{tabColor:{argb:acento}}});
      ws.columns = [10,20,18,40,24,12,18,14,14,8,22,17].map(function(w,k){ return {header:TAL_COLS[k], width:w}; });
      ft1.forEach(function(f){ ws.addRow(f); });
      [3,10,11,12].forEach(function(c){ ws.getColumn(c).numFmt = '@'; });
      ws.getColumn(12).alignment = {horizontal:'left'}; ws.getColumn(10).alignment = {horizontal:'center'};
      head(ws, TAL_COLS.length); if(ft1.length) estatusCF(ws, 'I', ft1.length+1);
      /* Hoja 2: Modelos-color */
      var gn = {}; D.grupos.forEach(function(g){ gn[g.id]=g.nombre; });
      var mcCols = ['Marca','Grupo','Modelo-color','Descripción','Color','Género','Silueta','Temporada','Estatus','Con UPC','Tallas'];
      var ws2 = wb.addWorksheet('Modelos-color', {properties:{tabColor:{argb:DORADO}}});
      ws2.columns = [10,20,18,40,24,12,18,14,14,10,8].map(function(w,k){ return {header:mcCols[k], width:w}; });
      rows.forEach(function(r){ var n = tallasDe(r[C.mc]).length; ws2.addRow([D.marca, gn[r._g], r[C.mc], r[C.desc], r[C.color], r[C.gen], r[C.sil], r[C.tem], r[C.est], n?'Sí':'No', n]); });
      ws2.getColumn(3).numFmt = '@'; ws2.getColumn(10).alignment = ws2.getColumn(11).alignment = {horizontal:'center'};
      head(ws2, mcCols.length); if(rows.length){ estatusCF(ws2, 'I', rows.length+1);
        ws2.addConditionalFormatting({ref:'J2:J'+(rows.length+1), rules:[{type:'cellIs', operator:'equal', formulae:['"No"'], priority:3, style:{font:{color:{argb:'FFA32A1F'},bold:true}}}]}); }
      /* Hoja 3: Fuentes */
      var f = D.fuentes||{}, ws3 = wb.addWorksheet('Fuentes', {properties:{tabColor:{argb:CARBON}}});
      ws3.columns = [{width:26},{width:90}];
      var t = ws3.addRow(['Consulta por marca · '+D.marca]); t.font = {bold:true,size:16,color:{argb:CARBON}}; t.height = 26;
      ws3.addRow(['Portal Supply · Comercio Excelente']).font = {italic:true,color:{argb:DORADO}}; ws3.addRow([]);
      var kv = function(k,v){ var r = ws3.addRow([k, v==null?'':(typeof v==='number'?v:String(v))]); r.getCell(1).font = {bold:true,color:{argb:'FFFFFFFF'}}; r.getCell(1).fill = {type:'pattern',pattern:'solid',fgColor:{argb:CARBON}}; r.getCell(2).fill = {type:'pattern',pattern:'solid',fgColor:{argb:PAPEL}}; r.getCell(2).alignment = {wrapText:true,vertical:'top'}; r.getCell(1).alignment = {vertical:'top'}; };
      kv('Descargado', new Date().toLocaleString('es-MX'));
      kv('Filtros aplicados', ft);
      kv('Modelos-color', rows.length); kv('Renglones de talla', ft1.length);
      kv('Line List', (f.line_list&&f.line_list.archivo||'sin archivo')+' · corte: '+fechaCorte(f.line_list));
      kv('Material Master', (f.material_master&&f.material_master.archivo||'sin archivo')+' · corte: '+fechaCorte(f.material_master));
      if(f.estatus) kv('Estatus', (f.estatus.archivo||'sin archivo')+' · corte: '+fechaCorte(f.estatus));
      kv('Generado', (D.generado||'')+' · '+(D.origen_datos||''));
      (D.notas||[]).forEach(function(n,k){ kv(k===0?'Notas':'', n); });
      kv('Cómo leerlo', 'Hoja "Tallas": una fila por talla con su SKU y UPC. Los modelos-color sin UPC todavía aparecen una vez con la leyenda "Sin UPC todavía". Hoja "Modelos-color": una fila por modelo-color con su número de tallas.');
      return wb.xlsx.writeBuffer();
    }).then(function(buf){
      if(marca!==marcaAct) return;
      bajar(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), nombreArchivo('xlsx', filtrado));
      msg('Listo: '+fmt(rows.length)+' modelos-color'); setTimeout(function(){ msg(''); }, 4000);
    }).catch(function(e){
      msg('No se pudo armar el Excel con formato; bajó en CSV.', true); exportarCSV(rows, filtrado);
    }).then(function(){ $('csv').disabled = $('xlsF').disabled = false; });
  }
  $('csv').onclick = function(){ if(D) exportar(D._filas.filter(function(){ return true; }), false); };
  $('xlsF').onclick = function(){ if(D) exportar(lista, true); };

  /* ---------- Eventos ---------- */
  var t; $('q').addEventListener('input', function(){ clearTimeout(t); t = setTimeout(filtrar, 180); });
  ['fSil','fGen','fTem','fEst','fUpc'].forEach(function(id){ $(id).onchange = filtrar; });
  $('clr').onclick = function(){ $('q').value=''; ['fSil','fGen','fTem','fEst','fUpc'].forEach(function(id){ $(id).value=''; }); grupo=null; if(D){ montarFiltros(); filtrar(); } };

  var ini = (location.search.match(/[?&]marca=([a-z]+)/)||[])[1];
  elegir(CONFIG.marcas.some(function(m){ return m.id===ini; }) ? ini : CONFIG.marcas[0].id);
})();
</script>
